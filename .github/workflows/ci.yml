name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies: the tests use node:test and the manifest checks mirror
      # `omarchy plugin validate`, which is not on a stock runner. The files are
      # listed explicitly because older Node versions do not take a directory.
      - run: node --test test/*.test.mjs
